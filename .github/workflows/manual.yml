name: 构建 Vontar H618 Armbian (Minimal 轻量版)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-minimal:
    runs-on: ubuntu-latest
    steps:
      # 1. 扩容磁盘空间（独立虚拟机，享受 70GB 空间）
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. 安装 QEMU 与交叉编译环境
      - name: 安装 QEMU 与编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      # 3. 检出当前仓库
      - name: 检出当前存储库
        uses: actions/checkout@v4

      # 4. 检出 Armbian 框架
      - name: 检出 Armbian 构建框架
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      # 5. 运行 Minimal 镜像编译
      - name: 运行 Armbian Minimal 编译
        run: |
          if [ -d "userpatches" ]; then
            cp -r userpatches build/
            chmod +x build/userpatches/customize-image.sh || true
          fi
          
          cd build
          
          sudo ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no || {
              echo "==================== Minimal 编译失败！末尾日志如下 ===================="
              sudo tail -n 150 output/logs/log-build-*.log.ans
              echo "======================================================================="
              exit 100
            }

      # 6. 打包产物
      - name: 检查和压缩镜像
        run: |
          mkdir -p release_files
          sudo chown -R "$(id -u):$(id -g)" build/output/images/ || true
          cd build/output/images/
          for img in *.img; do
            if [ -f "$img" ]; then
              echo "正在压缩 $img..."
              gzip -9 -v "$img"
            fi
          done
          cp -v *.img.gz *.sha *.txt ../../../release_files/ 2>/dev/null || true
          cd ../../../

      # 7. 上传 Artifact
      - name: 上传 Minimal 工件
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_Vontar_H618_Minimal
          path: release_files/*

      # 8. 发布到 Release
      - name: 发布 Release (Minimal)
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          name: "Vontar H618 Armbian (Minimal 轻量版)"
          tag_name: ${{ github.ref_name == 'main' && 'latest-minimal' || format('{0}-minimal', github.ref_name) }}
          body: |
            ## Vontar H618 Armbian Minimal
            - **内核**：`current`
            - **系统**：Debian 12 (Bookworm) Minimal
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
