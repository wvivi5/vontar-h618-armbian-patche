name: 构建 Vontar H618 Armbian 镜像

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 深度扩容磁盘空间（为 Armbian 编译腾出 60GB+ 空间）
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. 检出当前存储库（获取 userpatches 等）
      - name: 检出存储库
        uses: actions/checkout@v4

      # 3. 检出 Armbian 构建框架
      - name: 检出 Armbian 构建框架
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      # 4. 准备用户补丁并运行 Armbian 构建
      - name: 准备用户补丁并运行 Armbian 构建
        run: |
          # 复制用户自定义补丁到 Armbian 源码目录
          if [ -d "userpatches" ]; then
            cp -r userpatches build/
            chmod +x build/userpatches/customize-image.sh || true
          fi

          cd build

          # 执行 Armbian 镜像编译
          # RELEASE=bookworm (Debian 12 稳定版)
          # BUILD_MINIMAL=no (完整版，保留网卡驱动与固件，防止缺失 PHY 模块)
          sudo ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no

      # 5. 检查与压缩构建出的镜像
      - name: 检查和压缩已构建镜像
        run: |
          set -x
          mkdir -p release_files
          echo "=== 检查输出文件 ==="
          sudo ls -la build/output/images/ || true

          # 修改文件所有权，避免 root 权限问题
          sudo chown -R "$(id -u):$(id -g)" build/output/images/ || true

          cd build/output/images/
          for img in *.img; do
            if [ -f "$img" ]; then
              echo "正在压缩 $img..."
              gzip -9 -v "$img"
            fi
          done

          # 拷贝编译结果（压缩镜像、校验码、文本说明）到发布文件夹
          cp -v *.img.gz *.sha *.txt ../../../release_files/ 2>/dev/null || true
          cd ../../../
          echo "=== release_files ==="
          ls -la release_files/

      # 6. 上传 Artifact 构建产物
      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_Vontar_H618_Full
          path: release_files/*

      # 7. 发布 GitHub Release（当推送 Tag 或手动触发时）
      - name: 创建 GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          name: "Vontar H618 Armbian Full（带驱动 + Docker）"
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          body: |
            ## Vontar H618 自定义 Armbian 镜像
            - **内核分支**：`current`
            - **发行版**：Debian Bookworm (12)
            - **系统类型**：Standard Full (完整驱动版)
            - **硬件适配**：Vontar H618 (Allwinner H618)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
