name: Build Vontar H618 Split Artifacts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boot:
    name: 2a - U-Boot and DTB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Armbian Build Framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      - name: Build U-Boot and board DTB
        working-directory: build
        run: |
          set -euxo pipefail
          cp -r ../userpatches .
          chmod +x userpatches/customize-image.sh

          ./compile.sh uboot \
            BOARD=vontar-h618 \
            BRANCH=current \
            RELEASE=trixie \
            IGNORE_EXCEPTIONS=yes

          ./compile.sh kernel-dtb \
            BOARD=vontar-h618 \
            BRANCH=current \
            RELEASE=trixie \
            KERNEL_CONFIGURE=no \
            IGNORE_EXCEPTIONS=yes

      - name: Collect 2a boot artifacts
        run: |
          set -euxo pipefail
          mkdir -p split_files

          find build -type f -name 'linux-u-boot-vontar-h618-current*.deb' \
            -exec cp -v {} split_files/ \;
          find build -type f -name 'sun50i-h618-vontar-h618.dtb' \
            -exec cp -v {} split_files/ \;

          test -n "$(find split_files -type f -name 'linux-u-boot-*.deb' -print -quit)"
          test -n "$(find split_files -type f -name 'sun50i-h618-vontar-h618.dtb' -print -quit)"
          sha256sum split_files/* > split_files/SHA256SUMS-2a-Boot-DTB

      - name: Upload 2a artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vontar_H618_Split_2a_Boot_DTB
          path: split_files/*

  rootfs:
    name: 2b - Rootfs without boot configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Armbian Build Framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      - name: Build customized H618 image for rootfs extraction
        working-directory: build
        run: |
          set -euxo pipefail
          cp -r ../userpatches .
          chmod +x userpatches/customize-image.sh

          sudo ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            IGNORE_EXCEPTIONS=yes

      - name: Extract customized 2b rootfs without boot files
        run: |
          set -euxo pipefail
          mkdir -p split_files

          image="$(find build/output/images -maxdepth 2 -type f -name '*.img' -print -quit)"
          test -n "$image"

          mount_dir="$(mktemp -d)"
          cleanup() {
            sudo umount "$mount_dir" 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Parse the first Linux partition directly from the MBR. GitHub runners
          # do not reliably create /dev/loopXp1 after losetup --partscan.
          start_sector="$(python3 - "$image" <<'PY'
          import struct
          import sys

          with open(sys.argv[1], "rb") as image_file:
              mbr = image_file.read(512)

          if len(mbr) != 512 or mbr[510:512] != b"\x55\xaa":
              raise SystemExit("invalid MBR signature")

          for index in range(4):
              entry = mbr[446 + index * 16:462 + index * 16]
              partition_type = entry[4]
              start, sectors = struct.unpack_from("<II", entry, 8)
              if partition_type == 0x83 and sectors:
                  print(start)
                  break
          else:
              raise SystemExit("Linux root partition not found in MBR")
          PY
          )"
          test "$start_sector" -gt 0
          root_offset="$((start_sector * 512))"
          sudo mount -o "ro,loop,offset=$root_offset" "$image" "$mount_dir"

          # Reject a generic Armbian cache: 2b must contain project customization.
          test -x "$mount_dir/usr/sbin/dockerd"
          test -L "$mount_dir/etc/systemd/system/multi-user.target.wants/docker.service"
          test -x "$mount_dir/usr/local/sbin/vontar-h618-migrate-rootfs"
          test -f "$mount_dir/etc/systemd/system/vontar-h618-migrate.service"

          sudo tar \
            --numeric-owner \
            --xattrs \
            --acls \
            --one-file-system \
            --exclude='./boot/*' \
            -C "$mount_dir" \
            -cf - . | zstd -19 -T0 -o split_files/Vontar_H618_2b_Custom_Rootfs_NoBoot.tar.zst

          test -s split_files/Vontar_H618_2b_Custom_Rootfs_NoBoot.tar.zst
          sha256sum split_files/* > split_files/SHA256SUMS-2b-Rootfs

      - name: Upload 2b artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vontar_H618_Split_2b_Rootfs
          path: split_files/*

  release:
    name: Publish split artifacts
    needs: [ boot, rootfs ]
    runs-on: ubuntu-latest
    steps:
      - name: Download 2a artifact
        uses: actions/download-artifact@v4
        with:
          name: Vontar_H618_Split_2a_Boot_DTB
          path: release_files/2a

      - name: Download 2b artifact
        uses: actions/download-artifact@v4
        with:
          name: Vontar_H618_Split_2b_Rootfs
          path: release_files/2b

      - name: Publish split release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: split-latest
          name: Vontar H618 Split Artifacts (U-Boot + DTB + Rootfs)
          body: |
            ## Vontar H618 split artifacts
            - `2a/`: U-Boot and board DTB boot layer.
            - `2b/`: rootfs system layer without boot configuration.
          files: release_files/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
