name: Build Vontar H618 Armbian Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout Armbian Build Framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      - name: Prepare Userpatches & Run Armbian Build (Edge / Latest Kernel)
        run: |
          cd build
          cp -r ../userpatches .
          chmod +x userpatches/customize-image.sh

          # 执行 Armbian 源码构建
          # BRANCH=current 使用最新内核
          # BUILD_MINIMAL=yes (轻量系统 + customize-image.sh 预装 docker)
          sudo ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            IGNORE_EXCEPTIONS=yes

      - name: Inspect and Compress Built Images
        run: |
          set -x
          mkdir -p release_files
          echo "=== Output Images ==="
          sudo ls -la build/output/images/ || true

          # 修好属主，避免 root 拥有目录导致 Permission denied
          sudo chown -R "$(id -u):$(id -g)" build/output/images/

          cd build/output/images/
          for img in *.img; do
            if [ -f "$img" ]; then
              echo "Compressing $img with gzip..."
              gzip -9 -v "$img"
            fi
          done

          # 搬运所有产物（压缩镜像 + sha + txt 说明）到工作区
          cp -v *.img.gz *.img.sha *.img.txt ../../../release_files/ 2>/dev/null || true
          cd ../../../
          echo "=== release_files ==="
          ls -la release_files/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_Vontar_H618_Edge_Docker
          path: release_files/*

      - name: Create Release on Tag / Dispatch
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          name: "Vontar H618 Armbian Current LTS (Latest Kernel + Docker)"
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          body: |
            ## Vontar H618 Custom Armbian Image (Edge Branch)
            - **Kernel Branch**: `edge` (Latest Linux Kernel)
            - **Pre-installed**: Docker & Docker Compose (`docker.io`, `docker-compose-v2`)
            - **U-Boot & Board Patch**: Project U-Boot for Vontar H618 (sun50i-h618-vontar-h618.dtb)
            - **Features**: NEC IR Remote Keymap, Restored sunxi-gmac LAN driver, eMMC Dual-boot Android support preserved
            - **Boot Method**: microSD boot + USB HDD / microSD rootfs
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
