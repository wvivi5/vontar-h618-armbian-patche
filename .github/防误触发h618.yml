name: Build Vontar H618 Armbian Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '.github/workflows/build-armbian.yml'
      - 'userpatches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout Armbian Build Framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: build

      - name: Prepare Userpatches & Run Armbian Build (Edge / Latest Kernel)
        run: |
          cd build
          cp -r ../userpatches .
          chmod +x userpatches/customize-image.sh || true
          
          sudo ./compile.sh \
            BOARD=vontar-h618 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            IGNORE_EXCEPTIONS=yes

      - name: Inspect and Compress Built Images
        run: |
          set -x
          mkdir -p release_files
          echo "=== Output Images ==="
          sudo ls -la build/output/images/ || true
          
          # 修复文件属主，避免 Root 权限导致复制失败
          sudo chown -R "$(id -u):$(id -g)" build/output/images/
          cd build/output/images/
          
          for img in *.img; do
            if [ -f "$img" ]; then
              echo "Compressing $img with gzip..."
              gzip -9 -v "$img"
            fi
          done
          
          # 搬运所有产物到工作区
          cp -v *.img.gz *.img.sha *.img.txt ../../../release_files/ 2>/dev/null || true
          cd ../../../
          echo "=== release_files ==="
          ls -la release_files/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_Vontar_H618_Edge_Docker
          path: release_files/*

      - name: Create Release on Tag / Dispatch
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: release_files/*
          name: "Vontar H618 Armbian Current LTS (Latest Kernel + Docker)"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          body: |
            ## Vontar H618 Custom Armbian Image (Edge Branch)
            - **Kernel Branch**: `edge` (Latest Linux Kernel)
            - **Pre-installed**: Docker & Docker Compose (`docker.io`, `docker-compose-plugin`)
            - **U-Boot & Board Patch**: Project U-Boot for Vontar H618 (sun50i-h618-vontar-h618.dtb)
            - **Features**: NEC IR Remote Keymap, Restored sunxi-gmac LAN driver, eMMC Dual-boot Android support preserved
            - **Boot Method**: microSD boot + USB HDD / microSD rootfs
